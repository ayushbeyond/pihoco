<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="PIHOCO Menu Intelligence: upload your item sales and recipe costs and see what every dish really earns.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Menu Intelligence — PIHOCO</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://pihoco.com/menu-intelligence/">
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<style>@font-face{font-family:"Newsreader";src:url("../assets/fonts/newsreader-latin-standard-normal.woff2") format("woff2");font-weight:200 800;font-display:swap}@font-face{font-family:"Newsreader";src:url("../assets/fonts/newsreader-latin-standard-italic.woff2") format("woff2");font-weight:200 800;font-style:italic;font-display:swap}@font-face{font-family:"Instrument Sans";src:url("../assets/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2");font-weight:400 700;font-display:swap}</style>
<script src="../assets/js/vendor/xlsx-0.18.5.full.min.js"></script>
<script src="../assets/js/vendor/jspdf-2.5.1.umd.min.js"></script>
<script src="../assets/js/vendor/jspdf-autotable-3.8.2.min.js"></script>
<style>
/* Layout: a working ledger. Slim brand bar, one column of numbered stages, results read top-down: summary, matrix, items, actions. */
:root{
  --bg:#F3EEE6; --paper:#FAF6EE; --stone:#EBE4D8; --ink:#1C1915; --ink-2:#3B352E; --muted:#6A6157; --line:#D5CCBE; --line-2:#E3DBCE;
  --brass:#946F3E; --brass-ink:#7A5A2F; --brass-soft:#D2B487; --night:#171411; --on-night:#F3EEE6; --on-night-2:#B9AE9F;
  --star:#946F3E; --plow:#1C1915; --puzzle:#946F3E; --dog:#8A8073;
  --ok:#4F6B3E; --ok-bg:#E4E8D9; --warn:#9A5A23; --warn-bg:#F3E3CF; --bad:#9B3B2E; --bad-bg:#F2DBD5;
  --display:'Newsreader', 'Iowan Old Style', Georgia, serif;
  --sans:'Instrument Sans', 'Helvetica Neue', Arial, sans-serif;
  --r:2px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171411; --paper:#201C17; --stone:#2A251F; --ink:#F3EEE6; --ink-2:#DDD4C6; --muted:#B3A898; --line:#3E372F; --line-2:#332D26;
  --brass:#D2B487; --brass-ink:#D9BE93; --brass-soft:#8C6D43; --night:#0E0C0A; --on-night:#F3EEE6; --on-night-2:#B9AE9F;
  --star:#D2B487; --plow:#F3EEE6; --puzzle:#D2B487; --dog:#9C9283;
  --ok:#A9C38F; --ok-bg:#26301F; --warn:#E3A86F; --warn-bg:#3A2A1A; --bad:#EE9C8C; --bad-bg:#3B201B; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#171411; --paper:#201C17; --stone:#2A251F; --ink:#F3EEE6; --ink-2:#DDD4C6; --muted:#B3A898; --line:#3E372F; --line-2:#332D26;
  --brass:#D2B487; --brass-ink:#D9BE93; --brass-soft:#8C6D43; --night:#0E0C0A; --on-night:#F3EEE6; --on-night-2:#B9AE9F;
  --star:#D2B487; --plow:#F3EEE6; --puzzle:#D2B487; --dog:#9C9283;
  --ok:#A9C38F; --ok-bg:#26301F; --warn:#E3A86F; --warn-bg:#3A2A1A; --bad:#EE9C8C; --bad-bg:#3B201B; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brass-ink)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--brass-ink)}
.label{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:300;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,5vw,54px);line-height:1.04}
h2{font-size:clamp(26px,3.2vw,34px);line-height:1.1}
h3{font-size:22px;line-height:1.2}
h1 em,h2 em,h3 em{font-style:italic;color:var(--brass)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.wm{height:22px;width:auto;display:block}
.wm-cream{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .wm-ink{display:none} :root:not([data-theme="light"]) .wm-cream{display:block} }
:root[data-theme="dark"] .wm-ink{display:none} :root[data-theme="dark"] .wm-cream{display:block}
.bar .prod{font-family:var(--display);font-size:17px;font-style:italic;color:var(--brass);padding-left:14px;border-left:1px solid var(--line)}
.bar .sp{flex:1}
.modepill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--paper);cursor:pointer}
.modepill b{font-weight:600}
.proto{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:var(--r);cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--brass);border-color:var(--brass);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass-ink);background:transparent}
.btn.brass{background:var(--brass);border-color:var(--brass);color:var(--bg)}
.btn.brass:hover{background:var(--ink);border-color:var(--ink)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.linkbtn{background:none;border:0;padding:0;color:var(--brass-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

main{padding-block:36px 80px}
section+section{margin-top:40px}

/* start */
.start{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:end;padding-block:24px 8px}
.start .lede{font-family:var(--display);font-size:20px;line-height:1.45;color:var(--ink-2);max-width:34em;margin-top:18px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
.whocard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:14px;padding:26px 26px 24px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);position:relative;transition:border-color .15s, transform .15s}
.whocard:hover{border-color:var(--brass);transform:translateY(-2px)}
.whocard:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.whocard.dark{background:var(--night);border-color:var(--night);color:var(--on-night)}
.whocard.dark .muted{color:var(--on-night-2)}
.whocard.dark h3 em{color:#D2B487}
.whocard .go{margin-top:auto;font-size:13.5px;font-weight:600;color:var(--brass-ink)}
.whocard.dark .go{color:#D2B487}
.whocard ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px}
.ticket{border:1px solid var(--line);background:var(--paper);padding:18px 20px;font-size:13.5px}
.ticket .tline{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ticket .tline:last-child{border-bottom:0}

/* steps */
.steps{display:flex;gap:0;margin:0 0 28px;padding:0;list-style:none;border-bottom:1px solid var(--line);overflow-x:auto}
.steps li{padding:10px 18px 12px 0;margin-right:18px;font-size:13px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.steps li b{font-family:var(--display);font-weight:400;font-size:16px;margin-right:6px;color:var(--muted)}
.steps li.on{color:var(--ink);border-bottom-color:var(--brass)}
.steps li.on b{color:var(--brass)}
.steps li.done b{color:var(--brass-ink)}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:42px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brass);outline:none}
.hint{font-size:12.5px;color:var(--muted)}

/* file slots */
.need{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.slot{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);display:flex;flex-direction:column}
.slot .head{padding:18px 20px 14px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line-2)}
.slot .req{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--stone);color:var(--brass-ink);align-self:flex-start}
.slot ul{margin:0;padding:14px 20px 0 38px;font-size:13.5px;display:grid;gap:4px}
.slot ul .opt{color:var(--muted)}
.drop{margin:16px 20px 20px;border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg);transition:border-color .15s, background .15s}
.drop:hover,.drop.over{border-color:var(--brass);background:var(--stone)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop .big{font-family:var(--display);font-size:18px}
.drop.has{border-style:solid;border-color:var(--brass);background:var(--paper);text-align:left;align-items:stretch}
.fileline{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;min-width:0}
.fileline span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.callout{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);font-size:13.5px;border:1px solid var(--line);background:var(--stone)}
.callout.warn{background:var(--warn-bg);border-color:transparent;color:var(--ink)}
.callout.bad{background:var(--bad-bg);border-color:transparent}
.callout.ok{background:var(--ok-bg);border-color:transparent}
.callout .tag{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--paper);color:var(--ink-2);margin-top:2px}
.callout.warn .tag{color:var(--warn)} .callout.bad .tag{color:var(--bad)} .callout.ok .tag{color:var(--ok)}

/* tables */
.tbox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--ink);white-space:nowrap;background:var(--paper);position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
td select{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:5px 6px;max-width:170px}
.preview td,.preview th{font-size:12.5px;padding:7px 10px;white-space:nowrap}

/* class chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-Star{background:var(--star)} .d-Plowhorse{background:var(--plow)} .d-Puzzle{background:transparent;border:2px solid var(--puzzle)} .d-Dog{background:transparent;border:2px dashed var(--dog)} .d-NA{background:var(--line)}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;padding:2px 9px;border-radius:99px;background:var(--stone);color:var(--ink-2);white-space:nowrap}
.pill.brass{background:var(--brass);color:var(--bg)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}

/* results */
.rhead{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}
.rhead .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--paper);border-radius:var(--r)}
.kpi{padding:16px 18px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:300;line-height:1.1;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .edited{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brass-ink)}
.editbtn{position:absolute;top:10px;right:10px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);font-size:11px;padding:2px 7px;cursor:pointer;color:var(--muted)}
.editbtn:hover{color:var(--brass-ink);border-color:var(--brass)}
.classes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ccard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.ccard .n{font-family:var(--display);font-size:32px;font-weight:300;line-height:1}
.share{height:6px;background:var(--stone);border-radius:3px;overflow:hidden}
.share i{display:block;height:100%;background:var(--brass)}
.twocol{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:24px;align-items:start}
.matrix svg{width:100%;height:auto;display:block}
.matrix .ax{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.matrix .ql{fill:var(--brass-ink);font-size:11px;font-weight:600;letter-spacing:.14em;font-family:var(--sans)}
.matrix .nm{fill:var(--ink-2);font-size:10.5px;font-family:var(--sans)}
.findings{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--ink)}
.finding{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:28px 1fr;gap:10px}
.finding .i{font-family:var(--display);font-size:20px;color:var(--brass);line-height:1.2}
.finding textarea{width:100%;min-height:70px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.locked{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.locked .blur{filter:blur(5px);opacity:.55;pointer-events:none;user-select:none}
.locked .over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:color-mix(in srgb, var(--bg) 55%, transparent)}
.actions{display:grid;gap:12px}
.action{display:grid;grid-template-columns:120px minmax(0,1fr) 150px;gap:16px;padding:16px 18px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);align-items:start}
.action .imp{text-align:right}
.action .imp b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.dark-band{background:var(--night);color:var(--on-night);border-radius:var(--r);padding:26px 28px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dark-band h3 em{color:#D2B487}
.dark-band .muted{color:var(--on-night-2)}
.dark-band .btn.ghost{color:var(--on-night);border-color:#4A4239}
.dark-band .btn.ghost:hover{border-color:#D2B487;color:#D2B487}
.dark-band .btn.brass{background:#D2B487;border-color:#D2B487;color:#171411}

/* team */
.teamgrid{display:flex;flex-direction:column;gap:28px}
.side{order:-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start}
.kpi .label{padding-right:44px}
.recent{margin-top:44px}
.side .panel{padding:18px}
.cell-in{width:96px;text-align:right;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:4px 6px;font-variant-numeric:tabular-nums}
.cell-in.txt{width:130px;text-align:left}
.cell-in:hover{border-color:var(--line)}
.cell-in:focus{border-color:var(--brass);background:var(--bg);outline:none}
.changed{background:var(--warn-bg)!important}
td.changed-cell{box-shadow:inset 3px 0 0 var(--brass)}
.log{max-height:300px;overflow:auto;font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.log div{border-bottom:1px dashed var(--line);padding-bottom:6px}
.list td{vertical-align:middle}
.icon-btn{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);cursor:pointer;padding:2px 7px;font-size:12px;color:var(--muted)}
.icon-btn:hover{border-color:var(--brass);color:var(--brass-ink)}
.actiontxt{width:100%;min-width:220px;min-height:54px;font-size:12.5px;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:4px 6px;resize:vertical}
.actiontxt:hover{border-color:var(--line)} .actiontxt:focus{border-color:var(--brass);background:var(--bg);outline:none}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(15,13,11,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--paper);color:var(--ink);border-radius:var(--r);max-width:520px;width:100%;padding:28px;display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal ul{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--r);font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
footer{border-top:1px solid var(--line);padding-block:22px 34px;font-size:12.5px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width: 900px){
  .start,.twocol,.teamgrid{grid-template-columns:1fr}
  .side{position:static}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{border-bottom:1px solid var(--line-2)}
  .classes{grid-template-columns:repeat(2,1fr)}
}
@media (max-width: 640px){
  .who,.need,.grid2,.grid3{grid-template-columns:1fr}
  .action{grid-template-columns:1fr}
  .action .imp{text-align:left}
  .bar .prod{display:none}
  .panel{padding:18px}
}

/* customer home (BarGlance order: money headline, one button, sample, 3 steps, price, FAQ) */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,450px);gap:48px;align-items:start;padding-block:20px 8px}
.hero .lede{font-family:var(--display);font-size:20px;line-height:1.45;color:var(--ink-2);max-width:32em;margin-top:18px}
.promise{display:flex;gap:10px 18px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--muted)}
.promise span::before{content:"✓ ";color:var(--brass)}
.upcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:14px}
.upcard .drop{margin:0}
.fchip{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--bg);padding:8px 10px;font-size:13px;min-width:0}
.fchip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fchip select{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:3px 4px;font-size:12px}
.needs{font-size:12.5px;color:var(--muted);display:grid;gap:3px;margin:0;padding-left:18px}
details.more{border-top:1px solid var(--line-2);padding-top:10px}
details.more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--brass-ink)}
details.more .grid2{margin-top:12px;gap:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.money{background:var(--night);color:var(--on-night);border-radius:var(--r);padding:28px 30px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end}
.money .big{font-family:var(--display);font-size:clamp(40px,6vw,66px);font-weight:300;line-height:1;color:#D2B487;font-variant-numeric:tabular-nums}
.money .muted{color:var(--on-night-2)}
.money .btn.ghost{color:var(--on-night);border-color:#4A4239}
.money .btn.ghost:hover{color:#D2B487;border-color:#D2B487}
.fixes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.fix{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
.fix .amt{font-family:var(--display);font-size:24px;font-weight:300;color:var(--brass-ink)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;border-top:1px solid var(--ink)}
.how div{padding-top:16px;display:flex;flex-direction:column;gap:6px}
.how b{font-family:var(--display);font-weight:300;font-size:30px;color:var(--brass)}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tier{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px}
.tier.feat{border-color:var(--brass)}
.tier .p{font-family:var(--display);font-size:30px;font-weight:300;line-height:1.1}
.tier s{color:var(--muted);font-size:18px;margin-right:6px}
.tier ul{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}
.faq{border-top:1px solid var(--ink)}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{cursor:pointer;font-family:var(--display);font-size:19px}
.faq p{margin-top:8px;color:var(--ink-2);max-width:70ch}
.final{text-align:center;padding-block:28px;display:flex;flex-direction:column;align-items:center;gap:16px}
.mcta{display:none}
.prog{display:grid;gap:10px;font-size:14px}
.prog div{display:flex;gap:10px;align-items:center;color:var(--muted)}
.prog div.on{color:var(--ink)} .prog div.done{color:var(--ok)}
@media (max-width: 900px){ .hero{grid-template-columns:1fr} .fixes,.tiers{grid-template-columns:1fr} }
@media (max-width: 640px){ .how{grid-template-columns:1fr}
  .mcta{display:block;position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:1px solid var(--line);padding:10px max(16px, env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
  .mcta .btn{width:100%} .has-mcta{padding-bottom:70px} }
</style>

/* ============ column matching ============ */
const ROLES={name:'Dish / item name',category:'Category',qty:'Quantity sold',price:'Selling price',sales:'Sales amount',cost:'Food cost per portion',ignore:'Ignore'};
const SYN={
  name:['item name','item','menu item','dish','dish name','product','product name','item description','name','description','article','menu item name','recipe','recipe name'],
  category:['category','group','menu group','section','department','sub category','category name','menu category','item category','type','course','menu section'],
  qty:['qty','quantity','qty sold','quantity sold','items sold','sold','units sold','count','no of items','sales qty','total qty','number sold','sold qty','units','item qty'],
  price:['price','selling price','sale price','menu price','unit price','rate','mrp','avg price','average price','item price','price per item'],
  sales:['net amount','net sales','gross sales','sales','total sales','amount','revenue','net revenue','sales amount','gross amount','item total','total amount','net total','value'],
  cost:['food cost','cost','portion cost','recipe cost','cost per portion','food cost per portion','plate cost','unit cost','cogs','cost price','cost per plate','food cost per plate']
};
function headerScore(h){ const n=norm(String(h).replace(/\(.*?\)/g,'')); if(!n) return null; let best=null;
  for(const role in SYN){ for(const s of SYN[role]){ let sc=0; if(n===s) sc=100+s.length; else if((' '+n+' ').includes(' '+s+' ')) sc=50+s.length; if(sc&&(!best||sc>best.sc)) best={role,sc}; } }
  return best; }
function detectHeader(rows){ let best=-1,bestN=0; const lim=Math.min(rows.length,25);
  for(let i=0;i<lim;i++){ const r=rows[i]||[]; const roles=new Set(); r.forEach(c=>{const b=headerScore(c); if(b) roles.add(b.role);}); if(roles.size>bestN){bestN=roles.size;best=i;} if(roles.size>=3) break; }
  return bestN>=2?best:0; }
function autoMap(headers,kind){ const cand=headers.map((h,i)=>({i,b:headerScore(h)})).filter(x=>x.b).sort((a,b)=>b.b.sc-a.b.sc);
  const map={}; const used=new Set();
  for(const c of cand){ const role=c.b.role; if(kind==='costs'&&!['name','cost','category'].includes(role)) continue; if(map[role]!=null||used.has(c.i)) continue; map[role]=c.i; used.add(c.i); }
  return map; }

/* ============ file reading ============ */
async function readFile(file){
  if(typeof XLSX==='undefined') throw new Error('The spreadsheet reader did not load. Check your connection and reload the page.');
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(!['csv','xlsx','xls','txt'].includes(ext)) throw new Error(`“${file.name}” is a .${ext} file. Upload CSV or Excel (.csv, .xlsx, .xls).`);
  if(file.size>15*1024*1024) throw new Error(`“${file.name}” is over 15 MB. Export a shorter period or only the item-wise report.`);
  const buf=await file.arrayBuffer(); let wb;
  if(ext==='csv'||ext==='txt'){ wb=XLSX.read(new TextDecoder('utf-8').decode(buf),{type:'string',raw:true}); } else wb=XLSX.read(buf,{type:'array'});
  const sheets=wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})})).filter(s=>s.rows.some(r=>r.some(c=>String(c).trim()!=='')));
  if(!sheets.length) throw new Error(`“${file.name}” looks empty.`);
  return sheets; }
function prepTable(fileName,sheets,kind,sheetIdx){
  const sh=sheets[sheetIdx||0]; const hdr=detectHeader(sh.rows); const headers=(sh.rows[hdr]||[]).map((h,i)=>String(h).trim()||('Column '+(i+1)));
  return {fileName,sheets,sheetIdx:sheetIdx||0,hdr,headers,map:autoMap(headers,kind)}; }
function roleOfFile(t){ const m=autoMap(t.headers,'sales'); if(m.qty!=null) return 'sales'; if(m.name!=null&&m.cost!=null) return 'costs'; return 'sales'; }
function guessCurrency(t){ const flat=t.sheets[t.sheetIdx].rows.slice(0,60).flat().join(' ')+' '+t.headers.join(' ');
  if(/\bAED\b|dirham|\bDhs?\b/i.test(flat)) return 'AED'; if(/₹|\bRs\.?\b|\bINR\b/.test(flat)) return 'INR'; if(/\bSAR\b/.test(flat)) return 'SAR'; if(/A\$|\bAUD\b/.test(flat)) return 'AUD'; if(/\$|\bUSD\b/.test(flat)) return 'USD'; if(/£|\bGBP\b/.test(flat)) return 'GBP'; if(/€|\bEUR\b/.test(flat)) return 'EUR'; return null; }
const tableRows=t=>t.sheets[t.sheetIdx].rows.slice(t.hdr+1);

/* ============ build items ============ */
function buildItems(sales,costs){
  const m=sales.map; const issues=[]; const notes=[]; const merged=new Map(); const dups=[];
  for(const r of tableRows(sales)){
    const name=String(r[m.name]==null?'':r[m.name]).trim(); if(!name) continue;
    if(/^(grand\s*)?(sub\s*)?total\b|^totals?$/i.test(name)) continue;
    const qty=num(r[m.qty]); const price=m.price!=null?num(r[m.price]):null; const salesAmt=m.sales!=null?num(r[m.sales]):null;
    if(qty==null&&price==null&&salesAmt==null) continue;
    const cat=m.category!=null?(String(r[m.category]).trim()||'Uncategorised'):'Menu';
    const cost=m.cost!=null?num(r[m.cost]):null; const key=norm(name)+'|'+norm(cat);
    const rev=salesAmt!=null?salesAmt:(price!=null&&qty!=null?price*qty:null);
    if(merged.has(key)){ const it=merged.get(key); it.qty+=qty||0; it.rev+=rev||0; if(it.cost==null&&cost!=null) it.cost=cost; if(it.listPrice==null&&price!=null) it.listPrice=price; if(!dups.includes(name)) dups.push(name); }
    else merged.set(key,{id:uid(),name,category:cat,qty:qty||0,rev:rev||0,listPrice:price,cost});
  }
  const items=[...merged.values()].map(it=>{ let price=it.qty>0&&it.rev>0?it.rev/it.qty:(it.listPrice!=null?it.listPrice:0); return {id:it.id,name:it.name,category:it.category,qty:it.qty,price:Math.round(price*100)/100,cost:it.cost}; });
  if(m.sales!=null&&m.price==null) notes.push('Selling prices were worked out as sales ÷ quantity, so they reflect any discounts in the period.');
  if(m.sales!=null&&m.price!=null) notes.push('Where the report had both price and sales, the average price actually paid (sales ÷ quantity) was used.');
  if(m.category==null) notes.push('The sales report had no category column, so every dish is compared against the whole menu.');
  let unmatched=[]; const fuzzy=[];
  if(costs&&costs.map.name!=null&&costs.map.cost!=null){
    const cm=costs.map; const crow=[];
    for(const r of tableRows(costs)){ const n=String(r[cm.name]==null?'':r[cm.name]).trim(); if(!n||/^(grand\s*)?total/i.test(n)) continue; const c=num(r[cm.cost]); if(c==null) continue; crow.push({n,c,used:false}); }
    const idx=f=>{ const mp=new Map(); crow.forEach(x=>{ const k=f(x.n); if(k&&!mp.has(k)) mp.set(k,x); }); return mp; };
    const byN=idx(norm),byC=idx(compact),byT=idx(tokens);
    for(const it of items){ let hit=byN.get(norm(it.name)); let fz=false; if(!hit){ hit=byC.get(compact(it.name))||byT.get(tokens(it.name)); fz=!!hit; }
      if(hit){ it.cost=hit.c; hit.used=true; if(fz&&hit.n!==it.name) fuzzy.push(`“${hit.n}” → ${it.name}`); } }
    unmatched=crow.filter(x=>!x.used).map(x=>x.n);
  }
  if(fuzzy.length) issues.push({type:'fuzzy',sev:'info',title:`${fuzzy.length} name${fuzzy.length>1?'s were':' was'} matched loosely`,body:fuzzy.join('; ')+'. Check these are the same dish.'});
  if(dups.length) issues.push({type:'dup',sev:'info',title:`${dups.length} dish${dups.length>1?'es appear':' appears'} more than once`,body:`${dups.join(', ')}. The rows were added together.`});
  const zero=items.filter(i=>!(i.qty>0)); if(zero.length) issues.push({type:'zero',sev:'warn',title:`${zero.length} dish${zero.length>1?'es have':' has'} no sales`,body:`${zero.map(i=>i.name).join(', ')}. Marked “No sales” and left off the matrix.`});
  if(unmatched.length) issues.push({type:'unmatched',sev:'info',title:`${unmatched.length} costed dish${unmatched.length>1?'es aren’t':' isn’t'} on the sales report`,body:`${unmatched.join(', ')}. Left out. If the name is spelt differently, fix it in one file and upload again.`});
  return {items,issues,notes}; }
function liveIssues(items){ const out=[];
  const miss=items.filter(i=>i.qty>0&&!isNum(i.cost)); if(miss.length) out.push({type:'missing',sev:'bad',ids:miss.map(i=>i.id),title:`${miss.length} dish${miss.length>1?'es need':' needs'} costing`,body:`${miss.map(i=>i.name).join(', ')}. Add a food cost to place ${miss.length>1?'them':'it'} on the matrix.`});
  const over=items.filter(i=>isNum(i.cost)&&i.cost>=i.price&&i.price>0); if(over.length) out.push({type:'over',sev:'warn',ids:over.map(i=>i.id),title:`${over.length} dish${over.length>1?'es cost':' costs'} as much as ${over.length>1?'they sell':'it sells'} for, or more`,body:`${over.map(i=>i.name).join(', ')}. Check the cost and the price.`});
  return out; }

/* ============ analysis engine ============ */
const DEFAULT_SETTINGS={popFactor:0.7,cmMode:'weighted',cmManual:null,scope:'category',targetFc:0.30,vatIncluded:false,vat:0.05,delShare:0,commission:0.25,priceTest:0.05,days:30};
const CLASSES=['Star','Plowhorse','Puzzle','Dog'];
const CLASS_TXT={Star:'Sell well · earn well',Plowhorse:'Sell well · earn less',Puzzle:'Earn well · sell less',Dog:'Low on both'};
function priceStep(price,cur,p){ const raw=price*p; if(cur==='INR') return Math.max(5,Math.round(raw/5)*5); if(cur==='AED'||cur==='SAR') return Math.max(1,Math.round(raw)); return Math.max(0.25,Math.round(raw*4)/4); }
function compute(a,ver){
  const st=Object.assign({},DEFAULT_SETTINGS,ver.settings||{}); const cur=a.outlet.currency; const ov=ver.overrides||{};
  const vatF=st.vatIncluded?1/(1+st.vat):1; const commF=st.delShare*st.commission; const toMonth=30/(st.days>0?st.days:30);
  const items=ver.items.map(it=>Object.assign({},it));
  items.forEach(it=>{ it.qty=+it.qty||0; it.price=+it.price||0; it.hasCost=isNum(it.cost); it.revenue=it.qty*it.price; it.net=it.price*vatF; it.comm=it.net*commF;
    it.cm=it.hasCost?it.net-it.cost-it.comm:null; it.fc=it.hasCost&&it.net>0?it.cost/it.net:null; it.tcm=it.hasCost?it.cm*it.qty:null; it.eligible=it.hasCost&&it.qty>0; });
  const gkey=it=>st.scope==='menu'?'Whole menu':it.category; const groups={}; items.forEach(it=>{ (groups[gkey(it)]=groups[gkey(it)]||[]).push(it); });
  for(const g in groups){ const el=groups[g].filter(i=>i.eligible); const N=el.length; const Q=sum(el,i=>i.qty);
    const wavg=Q>0?sum(el,i=>i.cm*i.qty)/Q:0; const cmT=(st.cmMode==='manual'&&isNum(st.cmManual))?st.cmManual:wavg; const popQ=N?st.popFactor*Q/N:0;
    groups[g].forEach(it=>{ Object.assign(it,{group:g,groupN:N,groupQty:Q,groupAvg:wavg,cmT,popQ});
      if(!it.eligible){ it.autoClass='NA'; it.naLabel=it.qty>0?'Needs costing':'No sales'; return; }
      it.popIdx=popQ>0?it.qty/popQ:1; it.cmIdx=cmT>0?it.cm/cmT:(it.cm>=cmT?1.5:0.5);
      const hp=it.qty>=popQ, hc=it.cm>=cmT; it.autoClass=hp&&hc?'Star':hp?'Plowhorse':hc?'Puzzle':'Dog'; it.targetQty=Math.ceil(popQ); }); }
  items.forEach(it=>{ it.cls=it.classOverride&&it.classOverride!=='auto'?it.classOverride:it.autoClass; if(it.cls!=='NA') it.naLabel=null;
    const act=autoAction(it,cur,st,vatF,commF,toMonth); it.autoActionText=act.text; it.action=(it.actionOverride!=null&&it.actionOverride!=='')?it.actionOverride:act.text; it.impact=act.impact; it.impactLabel=act.label; it.short=act.short; it.why=act.why||''; it.loss=!!act.loss; });
  const costed=items.filter(i=>i.hasCost&&i.qty>0); const revAll=sum(items,i=>i.revenue); const netC=sum(costed,i=>i.net*i.qty); const fcAmt=sum(costed,i=>i.cost*i.qty); const tcm=sum(costed,i=>i.tcm); const platesC=sum(costed,i=>i.qty);
  const k={revenue:revAll,foodCostPct:netC>0?fcAmt/netC:null,contribution:tcm,avgCm:platesC>0?tcm/platesC:null,classified:items.filter(i=>CLASSES.includes(i.cls)).length,total:items.length,plates:sum(items,i=>i.qty)};
  const kpis=[
    {key:'revenue',label:'Sales',val:k.revenue,fmt:'money',sub:`${int(k.plates)} plates · ${st.days} days`},
    {key:'contribution',label:'What dishes leave',val:k.contribution,fmt:'money',sub:st.vatIncluded||commF?'After food cost'+(st.vatIncluded?', VAT':'')+(commF?', app commission':''):'Sales minus food cost'},
    {key:'foodCostPct',label:'Food cost',val:k.foodCostPct,fmt:'pct',sub:`Target ${pct(st.targetFc,0)}`},
    {key:'avgCm',label:'Per plate',val:k.avgCm,fmt:'money2',sub:'Average left per plate'}];
  kpis.forEach(x=>{ x.calc=x.fmt==='money'?money(x.val,cur):x.fmt==='money2'?m2(x.val,cur):x.fmt==='pct'?pct(x.val):String(x.val); const o=ov['kpi.'+x.key]; x.edited=o!=null&&o!==''; x.show=x.edited?o:x.calc; });
  const classes=CLASSES.map(c=>{ const its=items.filter(i=>i.cls===c); const t=sum(its.filter(i=>i.hasCost),i=>i.tcm); return {c,n:its.length,tcm:t,share:tcm>0?t/tcm:0}; });
  const rank=it=>it.loss?-1:it.cls==='Plowhorse'||it.cls==='Puzzle'?0:it.cls==='Dog'?1:it.cls==='NA'?2:3;
  const actions=items.slice().sort((a,b)=>rank(a)-rank(b)||((b.impact||0)-(a.impact||0))||((a.tcm||0)-(b.tcm||0)));
  const top3=actions.filter(i=>isNum(i.impact)&&i.impact>0).slice(0,3); const top3Sum=sum(top3,i=>i.impact);
  const el=items.filter(i=>CLASSES.includes(i.cls)); const F=[];
  if(el.length){ const topSold=el.slice().sort((a,b)=>b.qty-a.qty)[0]; const topEarn=el.slice().sort((a,b)=>b.tcm-a.tcm)[0];
    F.push(topSold.id!==topEarn.id?`${topSold.name} is your best-seller, but ${topEarn.name} leaves the most money: ${money(topEarn.tcm*toMonth,cur)} a month.`:`${topSold.name} is both your best-seller and your biggest earner (${money(topSold.tcm*toMonth,cur)} a month). Protect it.`);
    F.push(`${classes[0].n} of ${el.length} dishes are Stars and bring in ${pct(classes[0].share,0)} of what your menu leaves.`);
    if(isNum(k.foodCostPct)) F.push(`Food cost is ${pct(k.foodCostPct)} of ${st.vatIncluded?'sales before VAT':'sales'}, ${k.foodCostPct>st.targetFc?'above':'within'} the ${pct(st.targetFc,0)} target.`);
    if(commF) F.push(`Delivery-app commission takes about ${money(sum(costed,i=>i.comm*i.qty)*toMonth,cur)} a month at a ${pct(st.delShare,0)} delivery share and ${pct(st.commission,0)} commission.`);
    if(classes[3].n) F.push(`${classes[3].n} Dog${classes[3].n>1?'s':''} make${classes[3].n>1?'':'s'} up ${pct(classes[3].n/el.length,0)} of dishes but only ${pct(classes[3].share,0)} of what the menu leaves.`);
  }
  const findings=F.map((t,i)=>{ const o=ov['finding.'+i]; return {i,calc:t,text:(o!=null&&o!=='')?o:t,edited:o!=null&&o!==''}; });
  const cats={}; items.forEach(it=>{ const c=cats[it.category]=cats[it.category]||{name:it.category,n:0,qty:0,rev:0,fc:0,netC:0,tcm:0,qtyC:0,Star:0,Plowhorse:0,Puzzle:0,Dog:0,NA:0};
    c.n++; c.qty+=it.qty; c.rev+=it.revenue; if(it.hasCost&&it.qty>0){c.fc+=it.cost*it.qty;c.netC+=it.net*it.qty;c.tcm+=it.tcm;c.qtyC+=it.qty;} c[it.cls]=(c[it.cls]||0)+1; });
  return {st,items,k,kpis,classes,findings,actions,top3,top3Sum,cats:Object.values(cats),cur,toMonth,vatF,commF};
}
function autoAction(it,cur,st,vatF,commF,toMonth){
  if(it.cls!=='NA'&&isNum(it.cm)&&it.cm<=0) return {text:`It loses ${m2(-it.cm,cur)} on every plate after food cost${st.vatIncluded?' and VAT':''}. Check the recipe cost first. If it is right, reprice it or take it off the menu.`,impact:null,label:'Loses money',short:'Fix the cost or the price',why:`Loses ${m2(-it.cm,cur)} a plate.`,loss:true};
  switch(it.cls){
    case 'Star': return {why:'Popular and above the line.',text:`Protect it. Keep the recipe, the portion and its place on the menu. It leaves ${m2(it.cm,cur)} a plate.`,impact:null,label:'Protect',short:'Protect it'};
    case 'Plowhorse': { const step=priceStep(it.price,cur,st.priceTest); const gain=step*vatF*(1-commF)*it.qty*toMonth;
      return {why:`Popular, but leaves ${m2(it.cm,cur)} a plate against a ${it.group} line of ${m2(it.cmT,cur)}. Re-cost it first.`,text:`Guests choose it, but it leaves ${m2(it.cm,cur)} a plate, under the ${it.group} line of ${m2(it.cmT,cur)}. Re-cost the recipe and check the portion, then test ${m2(step,cur)} on the price (${m2(it.price,cur)} → ${m2(it.price+step,cur)}).`,impact:gain,label:'a month, if sales hold',short:`Raise ${m2(step,cur)} to ${m2(it.price+step,cur)}`}; }
    case 'Puzzle': { const extra=Math.max(0,(it.targetQty||0)-it.qty); const gain=extra*Math.max(0,it.cm-it.groupAvg)*toMonth;
      return {why:`Leaves ${m2(it.cm,cur)} a plate but sells only ${int(it.qty)}. Better spot, sharper description, staff pick.`,text:`It leaves ${m2(it.cm,cur)} a plate but sells only ${int(it.qty)}. Give it a better spot in ${it.group}, sharpen the description and have staff recommend it.`,impact:gain,label:extra?`a month, if ${int(extra*toMonth)} orders switch to it`:'a month',short:'Promote it'}; }
    case 'Dog': return {text:`Low on both: ${int(it.qty)} plates at ${m2(it.cm,cur)} a plate. Rework it with ingredients other dishes already use, or retire it after checking who orders it.`,impact:null,label:'Rework or retire',short:'Rework or retire'};
    default: return {text:it.qty>0?'Add a food cost so this dish can be placed on the matrix.':'No sales in this period. Consider taking it off the menu.',impact:null,label:it.qty>0?'Needs costing':'No sales',short:it.qty>0?'Needs costing':'No sales'};
  }
}

function wireDrops(){ $$('[data-drop]').forEach(d=>{ ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('over');})); ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('over');}));
  d.addEventListener('drop',ev=>{ const fl=ev.dataTransfer&&ev.dataTransfer.files; if(fl&&fl.length) takeFiles(Array.from(fl)); }); }); }
async function takeFiles(list){ const f=S.flow; f.err=null;
  for(const file of list){ try{ const sheets=await readFile(file); let t=prepTable(file.name,sheets,'sales',0); const role=roleOfFile(t); if(role==='costs') t=prepTable(file.name,sheets,'costs',0);
      f.files.push({t,role});
      if(role==='sales'){ const g=guessCurrency(t); if(g){ f.outlet.currency=g; f.opts.vatIncluded=['AED','SAR','GBP','EUR'].includes(g); } const head=sheets[0].rows.slice(0,4).filter(r=>(r||[]).filter(c=>String(c==null?'':c).trim()).length<=1).flat().join('\n');
        if(!f.outlet.name){ const mm=/^(?:outlet\s*:\s*)?(.*(?:caf[eé]|restaurant|bistro|kitchen|bar\b).*)$/im.exec(head); if(mm) f.outlet.name=mm[1].replace(/^outlet\s*:\s*/i,'').replace(/\(.*\)/,'').trim(); }
        if(/incl\.?\s*(\d+%\s*)?vat|vat\s*incl/i.test(head)) f.opts.vatIncluded=true; }
    }catch(e){ f.err=e.message||String(e); } }
  const seen={}; f.files=f.files.reverse().filter(x=>seen[x.role]?false:(seen[x.role]=true)).reverse();
  render(); }

/* ---- column matching (only when needed) ---- */
function curTables(){ const f=S.flow; const s=f.files.find(x=>x.role==='sales'); const c=f.files.find(x=>x.role==='costs'); return {sales:s&&s.t,costs:c&&c.t}; }
function mapProblems(){ const {sales,costs}=curTables(); const p=[]; if(!sales){ p.push('Add the item sales report.'); return p; } const m=sales.map;
  if(m.name==null) p.push('Sales report: which column has the dish name?'); if(m.qty==null) p.push('Sales report: which column has quantity sold?'); if(m.price==null&&m.sales==null) p.push('Sales report: which column has the price or sales amount?');
  if(m.cost==null){ if(!costs) p.push('Add the recipe costs file, or mark a food cost column in the sales report.'); else { if(costs.map.name==null) p.push('Recipe costs: which column has the dish name?'); if(costs.map.cost==null) p.push('Recipe costs: which column has the food cost?'); } }
  return p; }
const roleOf=(map,i)=>Object.keys(map).find(k=>map[k]===i);
function vMap(){ const {sales,costs}=curTables(); const probs=mapProblems();
  const block=(kind,t,need)=>{ const rows=tableRows(t).filter(r=>r.some(c=>String(c).trim())).slice(0,4);
    return `<div class="panel" style="padding:0;margin-bottom:20px"><div style="padding:16px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;border-bottom:1px solid var(--line-2)"><div><div class="label">${kind==='sales'?'Sales report':'Recipe costs'}</div><h3 style="margin-top:4px">${esc(t.fileName)}</h3></div>

        <select aria-label="What is the column ${esc(h)}?" data-map="${kind}" data-col="${i}">${['ignore',...need].map(r=>`<option value="${r}" ${(roleOf(t.map,i)||'ignore')===r?'selected':''}>${ROLES[r]}</option>`).join('')}</select></div></th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${t.headers.map((h,i)=>`<td>${esc(r[i])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`; };
  return `<div style="margin-bottom:20px"><div class="eyebrow">One quick check</div><h2 style="margin-top:8px">We couldn’t find <em>every column.</em></h2><p class="muted" style="margin-top:8px">Pick the right column under each heading, then carry on.</p></div>
  ${probs.length?`<div class="callout bad" style="margin-bottom:18px"><span class="tag">Needed</span><span>${probs.map(esc).join('<br>')}</span></div>`:''}
  ${sales?block('sales',sales,['name','category','qty','price','sales','cost']):''}${costs&&sales&&sales.map.cost==null?block('costs',costs,['name','cost','category']):''}
  <div class="row" style="justify-content:space-between"><button class="btn ghost" data-act="back">Back</button><button class="btn brass" data-act="analyse" ${probs.length?'disabled':''}>Analyse my menu</button></div>`; }

/* ---- progress then analyse ---- */
async function runAnalysis(){ const f=S.flow; if(mapProblems().length){ go('map'); return; }
  const {sales,costs}=curTables(); const steps=['Reading your files','Matching dishes to costs','Working out what each dish leaves','Ranking the fixes'];
  $('#layer').innerHTML=`<div class="scrim"><div class="modal" role="status" aria-live="polite"><div class="eyebrow">Your menu report</div><h3>Reading your menu…</h3><div class="prog">${steps.map((s,i)=>`<div id="pg${i}"><span class="spin" style="opacity:0"></span>${s}</div>`).join('')}</div></div></div>`;
  for(let i=0;i<steps.length;i++){ const el=$('#pg'+i); if(el){ el.className='on'; el.firstChild.style.opacity=1; } await new Promise(r=>setTimeout(r,320)); if(el){ el.className='done'; el.firstChild.outerHTML='<span aria-hidden="true">✓</span>'; } }
  const b=buildItems(sales,sales.map.cost!=null?null:costs); if(!b.items.length){ $('#layer').innerHTML=''; f.err='No dishes found. Check the dish name and quantity columns.'; go('map'); return; }
  const op=f.opts; const settings={vatIncluded:!!op.vatIncluded,vat:(+op.vat||0)/100,delShare:(+op.delShare||0)/100,commission:(+op.commission||0)/100,days:+op.days||30};
  const outlet=Object.assign({},f.outlet,{name:f.outlet.name.trim()||'Your menu'});
  const a=newAnalysis(f.src,outlet,{items:b.items,issues:b.issues,notes:b.notes},settings); DB.analyses.push(a); saveDB(); $('#layer').innerHTML=''; S.flow=null;
  if(f.src==='team') go('work',{cur:a.id}); else go('results',{cur:a.id}); }

function classHTML(R){ return `<div class="classes">${R.classes.map(c=>`<div class="ccard"><span class="chip"><i class="dot d-${c.c}"></i>${c.c}s</span><span class="n num">${c.n}</span><span class="small muted">${CLASS_TXT[c.c]}</span><div class="share" aria-hidden="true"><i style="width:${Math.round(c.share*100)}%"></i></div><span class="small"><b class="num">${pct(c.share,0)}</b> of what the menu leaves</span></div>`).join('')}</div>`; }
function matrixSVG(R,labels){
  const el=R.items.filter(i=>CLASSES.includes(i.cls)&&isNum(i.popIdx)); const W=640,H=420,L=46,T=18,Rr=16,B=46; const pw=W-L-Rr, ph=H-T-B;
  const xMax=Math.min(4,Math.max(2,...el.map(i=>i.popIdx*1.1))); const yMax=Math.min(3,Math.max(2,...el.map(i=>i.cmIdx*1.1))); const yMin=Math.min(0,...el.map(i=>i.cmIdx*1.05));
  const X=v=>L+Math.max(0,Math.min(1,v/xMax))*pw; const Y=v=>T+(1-(Math.max(yMin,Math.min(yMax,v))-yMin)/(yMax-yMin))*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Menu-engineering matrix: ${el.length} dishes placed by popularity and contribution against their section lines">`;
  s+=`<rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="var(--paper)" stroke="var(--line)"/><rect x="${X(1)}" y="${T}" width="${L+pw-X(1)}" height="${Y(1)-T}" fill="var(--stone)"/>`;
  s+=`<line x1="${X(1)}" y1="${T}" x2="${X(1)}" y2="${T+ph}" stroke="var(--muted)" stroke-dasharray="4 4"/><line x1="${L}" y1="${Y(1)}" x2="${L+pw}" y2="${Y(1)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  s+=`<text class="ql" x="${L+10}" y="${T+18}">PUZZLES</text><text class="ql" x="${L+pw-10}" y="${T+18}" text-anchor="end">STARS</text><text class="ql" x="${L+10}" y="${T+ph-10}">DOGS</text><text class="ql" x="${L+pw-10}" y="${T+ph-10}" text-anchor="end">PLOWHORSES</text>`;
  s+=`<text class="ax" x="${X(1)}" y="${T+ph+16}" text-anchor="middle">popularity line</text><text class="ax" x="${L+pw/2}" y="${H-8}" text-anchor="middle">How often it sells, against its section →</text><text class="ax" x="${L-8}" y="${Y(1)+4}" text-anchor="end">line</text><text class="ax" transform="translate(14 ${T+ph/2}) rotate(-90)" text-anchor="middle">What it leaves per plate →</text>`;
  const sty={Star:'fill="var(--star)"',Plowhorse:'fill="var(--plow)"',Puzzle:'fill="var(--paper)" stroke="var(--puzzle)" stroke-width="2"',Dog:'fill="var(--paper)" stroke="var(--dog)" stroke-width="2" stroke-dasharray="2 2"'};
  el.forEach(i=>{ const x=X(i.popIdx),y=Y(i.cmIdx); s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" ${sty[i.cls]}><title>${labels?esc(i.name)+' · ':''}${i.cls}</title></circle>`;
    if(labels){ const right=x<L+pw-110; s+=`<text class="nm" x="${(right?x+9:x-9).toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="${right?'start':'end'}">${esc(i.name.length>22?i.name.slice(0,21)+'…':i.name)}</text>`; } });
  return s+'</svg>'; }
const clsName=i=>i.cls==='NA'?i.naLabel:i.loss?'Loses money':i.cls;
function itemsTable(R){ const cur=R.cur; const net=R.vatF<1||R.commF>0;
  return `<div class="tbox"><table><thead><tr><th>Dish</th><th>Section</th><th class="r">Plates</th><th class="r">Price</th>${net?'<th class="r">After VAT / app</th>':''}<th class="r">Food cost</th><th class="r">Food cost %</th><th class="r">Leaves / plate</th><th class="r">A month</th><th>Class</th></tr></thead><tbody>${R.items.slice().sort((a,b)=>a.category.localeCompare(b.category)||(b.tcm||0)-(a.tcm||0)).map(i=>`<tr>

/* ---- team edits ---- */
function logIt(a,field,from,to){ a.log.push({at:new Date().toISOString(),who:'PIHOCO team',field,from:from===''||from==null?'(empty)':String(from),to:to===''||to==null?'(empty)':String(to)}); }
function teamEdit(el){ const a=getA(S.cur); if(!a) return; const ed=el.dataset.ed;
  if(ed==='notes'){ if(a.draft.notes!==el.value){ logIt(a,'Note to client',a.draft.notes?'(previous note)':'',el.value?'(new note)':''); a.draft.notes=el.value; } }
  else if(ed==='finding'){ const i=+el.dataset.i; const R=compute(a,a.draft); const f=R.findings[i]; const v=el.value.trim(); if(v===f.text) return; logIt(a,`Finding ${i+1}`,f.text,v); if(v===f.calc||v==='') delete a.draft.overrides['finding.'+i]; else a.draft.overrides['finding.'+i]=v; }
  else { const it=a.draft.items.find(x=>x.id===el.dataset.id); if(!it) return; let v=el.value; const R=compute(a,a.draft); const ri=R.items.find(x=>x.id===it.id);
    if(ed==='qty'||ed==='price'||ed==='cost'){ v=v===''?(ed==='cost'?null:0):+v; if(v!==null&&!isNum(v)){ toast('Enter a number.'); render(); return; } }
    if(ed==='name'||ed==='category'){ v=String(v).trim(); if(!v){ toast(ed==='name'?'A dish needs a name.':'A dish needs a section.'); render(); return; } }
    if(ed==='actionOverride'){ v=String(v).trim(); if(v===ri.action) return; if(v===''||v===ri.autoActionText){ if(it.actionOverride!=null) logIt(a,`${it.name} · Recommendation`,'(edited text)','(automatic text)'); delete it.actionOverride; } else { const cut=s=>s.length>60?s.slice(0,57)+'…':s; logIt(a,`${it.name} · Recommendation`,cut(ri.action),cut(v)); it.actionOverride=v; } }
    else { const old=it[ed]; if(ed==='classOverride'&&(old||'auto')===v) return; if(String(old==null?'':old)===String(v==null?'':v)) return; const lbl={name:'Dish name',category:'Section',qty:'Plates sold',price:'Price',cost:'Food cost',classOverride:'Class'}[ed];
      logIt(a,`${it.name} · ${lbl}`,ed==='classOverride'?(old&&old!=='auto'?old:'Auto ('+ri.autoClass+')'):old,ed==='classOverride'?(v==='auto'?'Auto':v):v); it[ed]=v; } }
  saveDB(); render(); }
function teamSetting(el){ const a=getA(S.cur); const k=el.dataset.set; const st=a.draft.settings; Object.keys(DEFAULT_SETTINGS).forEach(x=>{ if(!(x in st)) st[x]=DEFAULT_SETTINGS[x]; }); const old=st[k]; let v;
  if(el.type==='checkbox') v=el.checked; else v=el.value;
  if(['popFactor','targetFc','vat','delShare','commission','priceTest'].includes(k)){ v=+v/100; if(!(v>=0)||(k!=='delShare'&&k!=='vat'&&!(v>0))){ toast('Enter a percentage above 0.'); render(); return; } }
  if(k==='days'){ v=Math.round(+v); if(!(v>0)){ toast('Enter the number of days the report covers.'); render(); return; } }
  if(k==='cmManual') v=v===''?null:+v;
  if(old===v) return; const lbl={scope:'Compare against',popFactor:'Popularity line',cmMode:'Contribution line',cmManual:'Fixed contribution line',targetFc:'Food-cost target',vatIncluded:'Prices include VAT',vat:'VAT',delShare:'Delivery share',commission:'App commission',priceTest:'Price test size',days:'Days covered'}[k];
  const show=x=>['popFactor','targetFc','vat','delShare','commission','priceTest'].includes(k)?+(x*100).toFixed(2)+'%':k==='scope'?(x==='menu'?'Whole menu':'Own section'):k==='cmMode'?(x==='manual'?'Fixed amount':'Weighted average'):k==='vatIncluded'?(x?'Yes':'No'):x;
  logIt(a,'Settings · '+lbl,show(old),show(v)); st[k]=v;
  if(k==='cmMode'&&v==='manual'&&!isNum(st.cmManual)){ const R=compute(a,Object.assign({},a.draft,{settings:Object.assign({},st,{cmMode:'weighted'})})); st.cmManual=Math.round((R.k.avgCm||0)*100)/100; }
  saveDB(); render(); }

document.addEventListener('click',async ev=>{
  const sc=ev.target.closest('[data-scrim]'); if(sc&&ev.target===sc){ closeModal(); return; }
  const el=ev.target.closest('[data-act]'); if(!el) return; const act=el.dataset.act; const f=S.flow;
  try{ switch(act){
    case 'home': closeModal(); if(S.mode==='team'){ S.mode=null; S.flow=null; go('start'); } else { S.flow=newFlow('customer'); go('home'); } break;
    case 'mode': S.mode=el.dataset.mode; if(S.mode==='team'){ if(location.hash!=='#team') history.replaceState(null,'','#team'); go('team'); } else { if(location.hash) history.replaceState(null,'',location.pathname); S.flow=newFlow('customer'); go('home'); } break;
    case 'newcust': S.mode='customer'; S.flow=newFlow('customer'); go('home'); break;
    case 'toup': { const u=$('#upload'); if(u){ u.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>{ const i=$('#o-name'); if(i) i.focus({preventScroll:true}); },400); } break; }
    case 'newteam': S.flow=newFlow('team'); S.flow.outlet.type='Restaurant'; go('newteam'); break;
    case 'team': go('team'); break;
    case 'back': go(f&&f.src==='team'?'newteam':'home'); break;
    case 'openres': S.mode='customer'; go('results',{cur:el.dataset.id}); break;
    case 'openwork': go('work',{cur:el.dataset.id}); break;
    case 'sample': { const t=sampleTables(); f.files=[{t:t.sales,role:'sales'},{t:t.costs,role:'costs'}]; f.err=null; Object.assign(f.outlet,SAMPLE_OUTLET,{name:f.outlet.name||SAMPLE_OUTLET.name}); Object.assign(f.opts,{vatIncluded:true,vat:5,delShare:25,commission:25,days:30}); render(); const u=$('#upload'); if(u) u.scrollIntoView({block:'center'}); toast('Sample loaded: a Dubai café’s October sales and recipe costs.'); break; }
    case 'rmfile': f.files.splice(+el.dataset.i,1); render(); break;
    case 'tpl': await saveFile('PIHOCO_menu_data_template.xlsx',templateXLSX()); break;
    case 'analyse': await runAnalysis(); break;
    case 'unlock': mUnlock(); break;
    case 'dounlock': { const a=getA(S.cur); a.tier='paid'; saveDB(); closeModal(); render(); toast('Full Scorecard open.'); break; }
    case 'email': mEmail(); break;
    case 'review': mReview(); break;
    case 'addcosts': mCosts(); break;
    case 'close': closeModal(); break;
    case 'pdf': { const a=getA(S.cur); const old=el.innerHTML; el.innerHTML='<span class="spin"></span> Building PDF'; el.disabled=true; await new Promise(r=>setTimeout(r,30)); try{ await saveFile(fileBase(a)+'.pdf',buildPDF(a)); } finally { el.innerHTML=old; el.disabled=false; } break; }
    case 'xlsx': { const a=getA(S.cur); await saveFile(fileBase(a)+'.xlsx',buildXLSX(a)); break; }
    case 'editkpi': mKpi(el.dataset.k); break;
    case 'resetfinding': { const a=getA(S.cur); const i=el.dataset.i; logIt(a,`Finding ${+i+1}`,'(edited text)','(automatic text)'); delete a.draft.overrides['finding.'+i]; saveDB(); render(); break; }
    case 'resetrow': { const a=getA(S.cur); const d=a.draft.items.find(x=>x.id===el.dataset.id); const o=a.original.items.find(x=>x.id===el.dataset.id); if(d&&o){ logIt(a,`${d.name} · All fields`,'(edited)','(uploaded values)'); Object.keys(d).forEach(k=>delete d[k]); Object.assign(d,clone(o)); saveDB(); render(); } break; }
    case 'resetall': mConfirmResetAll(); break;
    case 'doresetall': { const a=getA(S.cur); logIt(a,'Everything','(all edits)','(uploaded values and settings)'); a.draft={items:clone(a.original.items),settings:clone(a.original.settings),overrides:{},notes:a.draft.notes}; saveDB(); closeModal(); render(); toast('All edits reset. Your note was kept.'); break; }
    case 'publish': mPublish(); break;
    case 'dopublish': { const a=getA(S.cur); a.published=Object.assign(clone(a.draft),{at:new Date().toISOString()}); saveDB(); closeModal(); render(); toast('Published. The client now sees the reviewed report.'); break; }
    case 'tier': { const a=getA(S.cur); const on=el.checked; a.tier=on?'paid':'free'; logIt(a,'Client access',on?'Free report':'Full Scorecard',on?'Full Scorecard':'Free report'); saveDB(); render(); break; }
  } }catch(e){ console.error(e); $('#layer').innerHTML=''; toast(e.message||'Something went wrong. Try again.'); }
});
document.addEventListener('change',ev=>{ const el=ev.target; const f=S.flow;
  if(el.matches('[data-file]')){ const fl=el.files; if(fl&&fl.length) takeFiles(Array.from(fl)); el.value=''; return; }
  if(el.matches('[data-o]')){ f.outlet[el.dataset.o]=el.value; if(el.dataset.o==='currency'){ f.opts.vatIncluded=['AED','SAR','GBP','EUR'].includes(el.value); render(); } return; }
  if(el.matches('[data-op]')){ const k=el.dataset.op; f.opts[k]=el.type==='checkbox'?el.checked:+el.value; if(k==='vatIncluded'||k==='delShare') render(); return; }
  if(el.matches('[data-role]')){ const x=f.files[+el.dataset.role]; x.role=el.value; x.t=prepTable(x.t.fileName,x.t.sheets,el.value,x.t.sheetIdx); f.files.filter(y=>y!==x&&y.role===x.role).forEach(y=>{ y.role=x.role==='sales'?'costs':'sales'; y.t=prepTable(y.t.fileName,y.t.sheets,y.role,y.t.sheetIdx); }); render(); return; }
  if(el.matches('[data-map]')){ const t=curTables()[el.dataset.map]; const i=+el.dataset.col; Object.keys(t.map).forEach(k=>{ if(t.map[k]===i) delete t.map[k]; }); if(el.value!=='ignore') t.map[el.value]=i; render(); return; }
  if(el.matches('[data-hdr]')){ const k=el.dataset.hdr; const t=curTables()[k]; const h=Math.max(1,Math.min(+el.value||1,t.sheets[t.sheetIdx].rows.length))-1; t.hdr=h; t.headers=(t.sheets[t.sheetIdx].rows[h]||[]).map((x,i)=>String(x).trim()||('Column '+(i+1))); t.map=autoMap(t.headers,k); render(); return; }
  if(el.matches('[data-ed]')&&S.view==='work'){ teamEdit(el); return; }
  if(el.matches('[data-set]')&&S.view==='work'){ teamSetting(el); return; }
});
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&$('#layer [data-scrim]')) closeModal(); if(ev.key==='Enter'&&ev.target.matches('input.cell-in')){ ev.preventDefault(); ev.target.blur(); } });
document.addEventListener('submit',ev=>{ ev.preventDefault(); const fm=ev.target; const a=getA(S.cur); const okEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  if(fm.dataset.form==='email'){ const v=$('#em').value.trim(); if(!okEmail(v)){ $('#emerr').innerHTML='<div class="callout bad"><span class="tag">Fix</span><span>Enter a full email address, like name@cafe.com.</span></div>'; $('#em').focus(); return; } a.email=v; a.emailRequestedAt=new Date().toISOString(); saveDB(); const b=fm.querySelector('button[type=submit]'); if(b){b.disabled=true;b.textContent='Sending…';} notifyPihoco('report',a,{email:v}).then(ok=>mEmailDone(v,ok)); }
  if(fm.dataset.form==='review'){ const v=$('#rv-em').value.trim(); if(!okEmail(v)){ $('#rverr').innerHTML='<div class="callout bad"><span class="tag">Fix</span><span>Add your email so the PIHOCO team can reach you.</span></div>'; $('#rv-em').focus(); return; } a.email=v; a.reviewRequested=true; a.reviewNote=$('#rv-note').value.trim(); saveDB(); const b=fm.querySelector('button[type=submit]'); if(b){b.disabled=true;b.textContent='Sending…';} notifyPihoco('audit',a,{email:v,note:a.reviewNote}).then(ok=>{ closeModal(); render(); toast(ok?'Request sent. PIHOCO will reply within one working day.':'We couldn’t send that. Please email contact@pihoco.com.'); }); }
  if(fm.dataset.form==='costs'){ let n=0; $$('[data-cost]',fm).forEach(inp=>{ const v=inp.value===''?null:+inp.value; if(v!=null&&v>=0){ [a.original.items,a.draft.items].forEach(list=>{ const it=list.find(x=>x.id===inp.dataset.cost); if(it) it.cost=v; }); n++; } }); saveDB(); closeModal(); render(); toast(n?`${n} cost${n>1?'s':''} added. Your report is updated.`:'No costs entered.'); }
  if(fm.dataset.form==='kpi'){ const k=fm.dataset.k; const v=$('#kv').value.trim(); const R=compute(a,a.draft); const x=R.kpis.find(z=>z.key===k); const old=x.show; if(v===''||v===x.calc) delete a.draft.overrides['kpi.'+k]; else a.draft.overrides['kpi.'+k]=v; if((v||x.calc)!==old) logIt(a,'Headline · '+x.label,old,v||x.calc+' (calculated)'); saveDB(); closeModal(); render(); }
});
